# Infraestructura local de desarrollo: pnpm infra:up / pnpm infra:down
# Solo para desarrollo y pruebas. Las credenciales son de ejemplo.
name: vanguardia

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: vanguardia
      POSTGRES_PASSWORD: vanguardia
      POSTGRES_DB: vanguardia
    ports:
      - '5432:5432'
    volumes:
      - postgres-datos:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U vanguardia -d vanguardia']
      interval: 5s
      timeout: 3s
      retries: 20

  # Almacenamiento compatible con S3. La imagen pública de MinIO ya no está disponible,
  # así que se usa SeaweedFS; el código solo habla con el SDK de S3.
  s3:
    image: chrislusf/seaweedfs:4.54
    command: server -dir=/data -ip=127.0.0.1 -ip.bind=0.0.0.0 -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json
    environment:
      # Clave de cifrado del lado del servidor (SSE-S3), solo para desarrollo.
      WEED_S3_SSE_KEY: vanguardia-clave-sse-solo-desarrollo
    ports:
      - '9000:8333'
    volumes:
      - s3-datos:/data
      - ./infra/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - '1025:1025'
      - '8025:8025'

volumes:
  postgres-datos:
  s3-datos:
