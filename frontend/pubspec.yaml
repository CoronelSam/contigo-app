
name: contigo_frontend
description: Aplicación móvil CONTIGO – Shriners Honduras
publish_to: none
version: 0.1.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.3.0
  http_parser: ^4.1.1
  image_picker: ^1.1.2
  file_picker: ^8.3.7
  uuid: ^4.5.1
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.3.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/esquemas/v1/

dependency_overrides:
  shared_preferences_foundation: 2.5.4
